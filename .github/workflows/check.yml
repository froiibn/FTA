name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # Native runners exercise platform APIs instead of treating cross-compilation as runtime proof.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  desktop:
    # Linux intentionally tests the headless Rust targets without installing WebKitGTK.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo check -p fta-desktop
      - run: cargo test -p fta-desktop
      - run: cargo clippy -p fta-desktop --all-targets -- -D warnings
      # Build the real package, including engine and MCP, rather than publishing a UI-only artifact.
      - run: npm run bundle
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FTA-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
