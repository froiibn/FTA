[package]
name = "fta-mcp"
# Keep local release executables aligned with the installer version.
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
fta-core = { path = "../fta-core" }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-std", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
