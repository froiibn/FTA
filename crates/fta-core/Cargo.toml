[package]
name = "fta-core"
# Keep local release executables aligned with the installer version.
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
same-file = "1"
x509-parser = { version = "0.18", default-features = false }
if-addrs = "0.14"
cap-std = "3"
cap-primitives = "3"
fs2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ipnet = { version = "2", features = ["serde"] }
mdns-sd = "0.15"
fta-platform = { path = "../fta-platform" }

# The native busy code distinguishes local pipe contention from missing-service/access failures.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[lints]
workspace = true
