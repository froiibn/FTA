[package]
name = "fta-cli"
# Keep local release executables aligned with the installer version.
version = "0.1.2"
edition = "2024"
publish = false

[[bin]]
name = "fta"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fta-core = { path = "../fta-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
