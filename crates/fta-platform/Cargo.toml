[package]
name = "fta-platform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
uuid = "1"

# Platform-only dependencies keep the Linux engine independent of desktop runtimes.
[target.'cfg(windows)'.dependencies]
# Shell shortcut and launch commands require ordinary DOS/UNC paths whenever normalization permits.
dunce = "1"
# Installer and runtime path spelling can differ; compare file identity before adopting an unowned handler.
same-file = "1"
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
uuid = { version = "1", features = ["v5"] }
tokio = { version = "1", features = ["net", "rt", "macros", "io-util"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
winreg = "0.55"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Atomic no-replace rename covers filesystems that cannot create hard links.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
