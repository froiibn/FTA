[package]
name = "fta-desktop"
# Keep local release executables aligned with the installer version.
version = "0.1.2"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fta-core = { path = "../../../crates/fta-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Transparent WebViews are required only by the Mac vibrancy surface; Windows stays opaque.
tauri = { version = "2", features = [] }
fta-platform = { path = "../../../crates/fta-platform" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSDictionary", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
fta-platform = { path = "../../../crates/fta-platform" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
